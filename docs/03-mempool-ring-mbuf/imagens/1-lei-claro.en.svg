<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 494" width="880" height="494" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">The cost is not measured: it is arithmetic, and measurement confirms it</title>
<desc id="d">Common-ring trips per million packets, by cache size, for DPDK 25.11 and 26.07. The measured dots land on the curves predicted by each version's refill size, and the six runs of each cell coincide.</desc>
