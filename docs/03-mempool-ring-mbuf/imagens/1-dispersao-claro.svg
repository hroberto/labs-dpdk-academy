<title id="t">A dispersao separa as versoes mais que a mediana</title>
<desc id="d">Tiras de pontos comparando a taxa de miss do cache do mempool entre DPDK 25.11 e 26.07 para varios tamanhos de cache. O 26.07 fica acima em toda a faixa, e em cache 64 suas repeticoes se espalham muito mais que as das celulas vizinhas.</desc>
