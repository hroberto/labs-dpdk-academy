<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 408" width="880" height="408" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">A banda não se multiplica por núcleo — ela é dividida</title>
<desc id="d">Gráfico de linha. A vazão agregada sobe de 138 M acessos/s com um núcleo para 328 M com doze, e satura por volta de oito. A linha de referência mostra onde ela estaria se escalasse por núcleo: 1 651 M com doze.</desc>
<rect width="880" height="408" fill="#fcfcfb"/>
<text x="28.0" y="34.0" fill="#0b0b0b" font-size="17" font-weight="600" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">A banda não se multiplica por núcleo — ela é dividida</text>
<text x="28.0" y="55.0" fill="#52514e" font-size="13" font-weight="400" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">vazão agregada com N núcleos físicos empurrando a mesma região — custo-paralelismo.c, fase 2</text>
