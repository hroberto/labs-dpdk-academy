<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 408" width="880" height="408" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Bandwidth does not multiply per core — it is divided</title>
<desc id="d">Line chart of aggregate throughput against the number of active physical cores. It rises from 171 million accesses per second with one core to 948 million with twelve, and the curve flattens from eight onwards. A grey reference line shows where it would be if it scaled per core: 2,051 million with twelve.</desc>
<rect width="880" height="408" fill="#1a1a19"/>
<text x="28.0" y="34.0" fill="#ffffff" font-size="17" font-weight="600" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Bandwidth does not multiply per core — it is divided</text>
<text x="28.0" y="55.0" fill="#c3c2b7" font-size="13" font-weight="400" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">aggregate throughput with N physical cores pushing the same region — custo-paralelismo.c, phase 2</text>
<line x1="104.0" y1="332.0" x2="712.0" y2="332.0" stroke="#2c2c2a" stroke-width="1"/>
<text x="92.0" y="336.0" fill="#898781" font-size="11" font-weight="400" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-variant-numeric="tabular-nums">0</text>
<line x1="104.0" y1="278.5" x2="712.0" y2="278.5" stroke="#2c2c2a" stroke-width="1"/>
<text x="92.0" y="282.5" fill="#898781" font-size="11" font-weight="400" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-variant-numeric="tabular-nums">425</text>
<line x1="104.0" y1="225.0" x2="712.0" y2="225.0" stroke="#2c2c2a" stroke-width="1"/>
<text x="92.0" y="229.0" fill="#898781" font-size="11" font-weight="400" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-variant-numeric="tabular-nums">850</text>
<line x1="104.0" y1="171.5" x2="712.0" y2="171.5" stroke="#2c2c2a" stroke-width="1"/>
<text x="92.0" y="175.5" fill="#898781" font-size="11" font-weight="400" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-variant-numeric="tabular-nums">1 275</text>
<line x1="104.0" y1="118.0" x2="712.0" y2="118.0" stroke="#2c2c2a" stroke-width="1"/>
<text x="92.0" y="122.0" fill="#898781" font-size="11" font-weight="400" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-variant-numeric="tabular-nums">1 700</text>
<text x="28.0" y="98.0" fill="#898781" font-size="11" font-weight="400" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">M accesses/s (sum of all cores)</text>
<polyline points="104.0,310.4 159.3,288.7 269.8,245.5 490.9,159.0 712.0,118.0" fill="none" stroke="#898781" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="708.0" y="106.0" fill="#898781" font-size="12" font-weight="600" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">if it scaled per core</text>
<polyline points="104.0,310.4 159.3,290.5 269.8,256.6 490.9,216.0 712.0,212.7" fill="none" stroke="#3987e5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="104.0" cy="310.4" r="4.5" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/>
<circle cx="159.3" cy="290.5" r="4.5" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/>
<circle cx="269.8" cy="256.6" r="4.5" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/>
<circle cx="490.9" cy="216.0" r="4.5" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/>
<circle cx="712.0" cy="212.7" r="4.5" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/>
<text x="706.0" y="238.7" fill="#ffffff" font-size="12" font-weight="600" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-variant-numeric="tabular-nums">948 M/s — the ceiling</text>
<text x="116.0" y="296.4" fill="#ffffff" font-size="12" font-weight="600" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-variant-numeric="tabular-nums">172 M/s</text>
<text x="104.0" y="354.0" fill="#898781" font-size="12" font-weight="400" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-variant-numeric="tabular-nums">1</text>
<text x="159.3" y="354.0" fill="#898781" font-size="12" font-weight="400" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-variant-numeric="tabular-nums">2</text>
<text x="269.8" y="354.0" fill="#898781" font-size="12" font-weight="400" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-variant-numeric="tabular-nums">4</text>
<text x="490.9" y="354.0" fill="#898781" font-size="12" font-weight="400" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-variant-numeric="tabular-nums">8</text>
<text x="712.0" y="354.0" fill="#898781" font-size="12" font-weight="400" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-variant-numeric="tabular-nums">12</text>
<text x="408.0" y="372.0" fill="#898781" font-size="12" font-weight="400" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">active physical cores</text>
<text x="28.0" y="396.0" fill="#ffffff" font-size="13" font-weight="600" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">With 12 active, each core does 46% of what it did alone.</text>
</svg>
