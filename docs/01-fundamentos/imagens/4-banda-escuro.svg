<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">A banda que você usa é a que o seu padrão de acesso permite</title>
<desc id="d">Gráfico de barras horizontais. Sobre a mesma RAM, um núcleo move 21,4 GB/s em acesso sequencial, 11,0 GB/s em acesso aleatório com endereços independentes e 0,7 GB/s quando cada endereço depende do anterior.</desc>
