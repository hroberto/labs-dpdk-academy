<title id="t">A banda que você usa é a que o seu padrão de acesso permite</title>
<desc id="d">Gráfico de barras horizontais com a banda efetiva de um núcleo sobre a mesma RAM: 11,0 GB/s em acesso aleatório com endereços independentes e 0,74 GB/s quando cada endereço depende do anterior — 15 vezes de diferença entre os dois padrões que a memória limita.</desc>
