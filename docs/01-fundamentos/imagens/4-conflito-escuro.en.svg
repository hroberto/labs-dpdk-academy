<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 612" width="880" height="612" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Throughput is bought with concurrency — and paid for in latency</title>
<desc id="d">Two stacked charts sharing the same horizontal axis K on a logarithmic scale, from 1 to 64 accesses in flight. In the first, throughput rises from 12.9 to 410 M accesses/s and saturates; a dashed line marks the 10 GbE line rate. In the second, on log scales on both axes, the amortized cost per access falls from 77 to 2.44 ns while the time until the batch is ready stays flat around 80 ns up to K = 16 and rises to 156 ns at K = 64. Both curves are in nanoseconds; the second is the first multiplied by K.</desc>
<rect width="880" height="612" fill="#1a1a19"/>
<text x="28.0" y="34.0" fill="#ffffff" font-size="17" font-weight="600" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Throughput is bought with concurrency — and paid for in latency</text>
<text x="28.0" y="55.0" fill="#c3c2b7" font-size="13" font-weight="400" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">K independent accesses in flight over the same region — custo-paralelismo.c</text>
<text x="100.0" y="110.0" fill="#ffffff" font-size="14" font-weight="600" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">1 · what the machine delivers</text>
<text x="28.0" y="90.0" fill="#898781" font-size="11" font-weight="400" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">M accesses/s</text>
