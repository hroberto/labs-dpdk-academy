<text x="28.0" y="232.0" fill="#0b0b0b" font-size="13" font-weight="600" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">15× difference — same machine, same memory, same core.</text>
