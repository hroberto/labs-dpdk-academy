<text x="284.0" y="91.0" fill="#0b0b0b" font-size="13" font-weight="400" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">random, independent addresses</text>
<path d="M300.0,72.0 H533.1 Q537.1,72.0 537.1,76.0 V96.0 Q537.1,100.0 533.1,100.0 H300.0 Z" fill="#2a78d6"/>
