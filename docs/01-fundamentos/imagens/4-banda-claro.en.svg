<text x="429.1" y="192.0" fill="#898781" font-size="12" font-weight="400" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-variant-numeric="tabular-nums">6</text>
<line x1="493.7" y1="80.0" x2="493.7" y2="172.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="493.7" y="192.0" fill="#898781" font-size="12" font-weight="400" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-variant-numeric="tabular-nums">9</text>
<line x1="558.3" y1="80.0" x2="558.3" y2="172.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="558.3" y="192.0" fill="#898781" font-size="12" font-weight="400" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-variant-numeric="tabular-nums">12</text>
<line x1="622.9" y1="80.0" x2="622.9" y2="172.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="622.9" y="192.0" fill="#898781" font-size="12" font-weight="400" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-variant-numeric="tabular-nums">15</text>
<line x1="687.4" y1="80.0" x2="687.4" y2="172.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="687.4" y="192.0" fill="#898781" font-size="12" font-weight="400" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-variant-numeric="tabular-nums">18</text>
<line x1="752.0" y1="80.0" x2="752.0" y2="172.0" stroke="#e1e0d9" stroke-width="1"/>
