<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 612" width="880" height="612" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Vazão se compra com concorrência — e se paga com latência</title>
<desc id="d">Dois gráficos empilhados com o mesmo eixo horizontal K em escala logarítmica, de 1 a 64 acessos em voo. No primeiro, a vazão sobe de 13,0 para 411 M acessos/s e satura; uma linha tracejada marca o line rate de 10 GbE. No segundo, em escala log nos dois eixos, o custo amortizado por acesso cai de 77 para 2,43 ns enquanto o tempo até o lote ficar pronto permanece plano em torno de 80 ns até K = 16 e sobe para 156 ns em K = 64. As duas curvas estão em nanossegundos; a segunda é a primeira multiplicada por K.</desc>
<rect width="880" height="612" fill="#fcfcfb"/>
<text x="28.0" y="34.0" fill="#0b0b0b" font-size="17" font-weight="600" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Vazão se compra com concorrência — e se paga com latência</text>
<text x="28.0" y="55.0" fill="#52514e" font-size="13" font-weight="400" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">K acessos independentes em voo sobre a mesma região — custo-paralelismo.c</text>
<text x="100.0" y="110.0" fill="#0b0b0b" font-size="14" font-weight="600" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">1 · quanto a máquina entrega</text>
