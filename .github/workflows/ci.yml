name: CI

# GATILHO RESTRITO A main E A PULL REQUESTS, e a razao e uma so: `on: push` sem
# filtro dispara tambem em TAG, e reconstruir uma tag antiga com o ferramental de
# hoje produz vermelho permanente. Foi o que aconteceu com `v0.01.00` -- a arvore
# daquele commit nao tem os verificadores que o pre-commit de hoje executa, entao
# a CI dela nunca mais vai passar, por definicao.
#
# Vermelho que nao tem conserto treina quem le a lista a ignorar o vermelho, e
# foi exatamente assim que cinco falhas reais passaram despercebidas nesta
# arvore. Um sinal que nao pode ficar verde nao e sinal.
#
# Branch de trabalho continua coberta: entra por `pull_request`, onde o resultado
# tem para onde ir.
on:
  push:
    branches: [main]
  pull_request:

# Menor privilegio para o GITHUB_TOKEN. Sem este bloco ele herda o padrao da
# conta, que pode ser escrita -- e este workflow so compila e testa: nao cria
# release, nao comenta em PR, nao empurra nada. Se uma acao de terceiros for
# comprometida um dia, o estrago fica limitado ao que ela pode ler.
permissions:
  contents: read

jobs:
  build-and-test:
    # Imagem FIXA, nao 'ubuntu-latest': o compilador padrao muda quando a
    # imagem muda, e este projeto exige C++23 com <print> (GCC 14+). Com
    # 'latest' a CI quebraria num dia em que ninguem tocou no codigo.
    runs-on: ubuntu-24.04
    steps:
      # Fixada por SHA, nao por tag: `v7` e um ponteiro movel, e quem controla
      # o repositorio da acao pode reaponta-lo. O SHA e imutavel.
      #
      # Corresponde a v7. Essa linha nao e decorativa: `ferramental/qualidade/pre-commit.sh`
      # a le para resolver o SHA de volta e avisar se ele deixou de ser o topo
      # do major declarado -- foi assim que apareceu o PR #1 do Dependabot
      # propondo saltar de v4 para v7, e foi assim que se notou que ele trocava
      # o SHA sem trocar esta linha.
      #
      # Para atualizar dentro do mesmo major:
      #   gh api repos/actions/checkout/git/ref/tags/v7 --jq '.object.sha'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        # HISTORICO COMPLETO, e nao o clone raso do padrao.
        #
        # O `vcs_tag` do Meson grava `git describe` no `academy_version.h`, e e
        # dele que sai a linha de proveniencia de todo numero medido. Num clone
        # raso nao ha tags, `git describe` falha, e o binario do CI passa a
        # dizer que nao sabe de que versao veio -- justamente o campo que o
        # projeto exige de qualquer coleta.
        with:
          fetch-depth: 0

      # DPDK e dependencia de AMBIENTE (bibliotecas + hugepages + drivers), por
      # isso vem da distribuicao e nao de um gerenciador de pacotes C++.
      # Os testes rodam com --no-huge, entao o runner nao precisa de hugepages.
      - name: Instalar DPDK e ferramentas de build
        run: |
          sudo apt-get update
          # `cppcheck` entra aqui porque o `pre-commit.sh` ja o invoca: sem o
          # pacote, `analise-estatica.sh` imprime PULADO e o CI fica verde SEM
          # analise estatica. Verificador ausente nao pode parecer verificador
          # que passou.
          sudo apt-get install -y dpdk-dev pkg-config ninja-build python3-pip g++-14 cppcheck
          # GCC 14 e o minimo para <print>/<expected>, que check-env.sh exige.
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 100
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100
          python3 -m pip install --upgrade meson
          pkg-config --modversion libdpdk

      - name: Diagnosticar ambiente
        run: ./scripts/check-env.sh

      # As regras de consistencia do projeto rodam AQUI, e nao so num gancho.
      #
      # INCIDENTE: este passo ja existiu uma vez e foi perdido num `reset
      # --hard`. Pior: o README de ferramental/qualidade continuou afirmando que
      # "ele e executado pela CI", declarando consertada uma lacuna que voltou a
      # existir. Retratacao falsa e pior que a lacuna original, porque desliga o
      # alarme -- quem le acredita que esta coberto.
      #
      # `.github/dependabot.yml` publica este script como a protecao numero 2
      # contra merge de major sem revisao. Um gancho LOCAL de commit nao roda em
      # PR do Dependabot por construcao; rodando aqui, a afirmacao passa a ser
      # verdadeira, porque a CI executa em pull_request.
      # --rapido, e a razao importa: sem ele o pre-commit roda a SUITE INTEIRA
      # aqui dentro, e os passos de L1/L2/L3 logo abaixo a rodam de novo. Alem do
      # tempo dobrado, uma falha ficava sem endereco -- o X vermelho aparecia
      # nesta etapa, antes de `meson setup`, sem dizer qual suite quebrou. Com
      # --rapido esta etapa confere sintaxe, consistencia, segredos, documentacao
      # e assinatura; medir o codigo e das etapas nomeadas.
      - name: Consistencia do projeto (regras do pre-commit)
        run: ./ferramental/qualidade/pre-commit.sh --rapido

      # GTest vem do subprojeto do Meson (subprojects/gtest.wrap), com hash fixo.
      - name: Configurar
        run: meson setup build

      - name: Compilar
        run: meson compile -C build

      - name: Testes L1 (logica pura, sem EAL)
        run: meson test -C build --suite l1 --print-errorlogs

      # Os programas de medicao dos fundamentos coletam 25 amostras por padrao,
      # o que leva minutos. No CI o objetivo e apenas verificar que executam,
      # entao o numero minimo basta.
      - name: Testes L2 (EAL real, sem hugepages e sem NIC)
        env:
          DPDK_ACADEMY_AMOSTRAS: "3"
          # Teto de rodadas POR amostra. Reduzir amostras nao bastava: o custo
          # de `custo-espera` esta nas 200 000 rodadas de repasse entre threads,
          # que num runner de 2 nucleos estouraram os 300 s do timeout.
          DPDK_ACADEMY_RODADAS: "20000"
        run: meson test -C build --suite l2 --print-errorlogs

      # L3 exige do HOST o que o runner nao tem: hugetlbfs gravavel, dois
      # dominios de cache L3, varios nucleos fisicos. Roda mesmo assim, e o
      # esperado e que a maioria seja PULADA (codigo 77).
      #
      # Rodar e ver "Skipped" NAO e desperdicio: e o que garante que o caminho
      # de pulo continua funcionando. Antes desta secao, estes testes saiam com
      # 0 e apareciam como OK sem ter verificado nada -- o falso verde durou
      # todo o tempo em que estiveram no CI.
      - name: Testes L3 (dependem do host; PULAR aqui e o esperado)
        env:
          DPDK_ACADEMY_AMOSTRAS: "3"
          DPDK_ACADEMY_RODADAS: "20000"
        run: meson test -C build --suite l3 --print-errorlogs

  # ----------------------------------------------------------------------
  # SANITIZADORES: o que o compilador nao ve e os testes sozinhos nao pegam.
  #
  # A suite verifica CONTRATO -- codigo de saida, contagem, invariante do pool.
  # Ela passa com um acesso fora de limites que por acaso nao corrompe nada, e
  # com comportamento indefinido que o otimizador ainda nao explorou. O
  # `b_sanitize=address,undefined` instrumenta os dois.
  #
  # JOB SEPARADO, e nao uma etapa do principal: o binario instrumentado NAO e o
  # de producao -- ASan muda leiaute e custo --, entao ele nao pode ser o mesmo
  # que roda os programas de medicao. Misturar os dois faria a barra medir o
  # instrumentado.
  #
  # L3 fica de fora: ela exige hugetlbfs e dois dominios de L3, que o runner nao
  # tem, e o esperado la e PULAR. Sanitizar o que nao roda nao acrescenta nada.
  #
  # Conferido localmente em 25/09/2026 antes de entrar aqui: L1 e L2 passam com
  # zero achado, e o build sai com zero aviso.
  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      # Corresponde a v7, o mesmo pin do job principal.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Instalar DPDK e ferramentas de build
        run: |
          sudo apt-get update
          sudo apt-get install -y dpdk-dev pkg-config ninja-build python3-pip g++-14
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 100
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100
          python3 -m pip install --upgrade meson

      - name: Configurar com ASan e UBSan
        run: meson setup build-san -Db_sanitize=address,undefined

      - name: Compilar
        run: meson compile -C build-san

      # `halt_on_error=1` e deliberado: sem ele o ASan imprime o achado e segue,
      # o teste termina com zero e o job fica VERDE com o defeito na saida.
      # `detect_leaks=0` porque a EAL nao libera tudo por desenho, e vazamento
      # dela nao e achado deste projeto -- a posse de objeto do mempool, que E,
      # ja tem verificacao propria no invariante do pool.
      - name: Testes L1 e L2 sob sanitizadores
        env:
          DPDK_ACADEMY_AMOSTRAS: "3"
          DPDK_ACADEMY_RODADAS: "20000"
          ASAN_OPTIONS: "halt_on_error=1:detect_leaks=0"
          UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
        run: |
          meson test -C build-san --suite l1 --print-errorlogs
          meson test -C build-san --suite l2 --print-errorlogs

  # ----------------------------------------------------------------------
  # AS RELEASES QUE O MATERIAL PUBLICA, e nao a que o `apt` oferece.
  #
  # O job principal usa `dpdk-dev` do Ubuntu 24.04, que e 23.11. O material
  # publica numeros de 25.11 e de 26.07 -- e o estudo do cache do mempool
  # compara as duas. Um defeito que so exista numa delas passava.
  #
  # O `preparar-dpdk.sh` ja sabe construir e instalar num prefixo; aqui ele e
  # invocado com `--minimo`, que compila so os drivers que o estudo usa. Sem
  # isso a construcao passa de vinte minutos por celula.
  #
  # O CACHE E O QUE TORNA ISTO VIAVEL. A chave inclui a versao e o hash do
  # script: mudou o script, reconstroi; nao mudou, reaproveita. Sem cache,
  # cada push pagaria duas construcoes do DPDK.
  #
  # SO L1 E L2. A L3 exige hugetlbfs e dois dominios de L3, que o runner nao
  # tem -- e o esperado la e PULAR, o que o job principal ja verifica.
  #
  # NAO VALIDADO LOCALMENTE. Este job constroi o DPDK do fonte no runner, e nao
  # ha como executa-lo na maquina de desenvolvimento. A primeira execucao e o
  # teste dele; se falhar, falha aqui e nao no material.
  releases-dpdk:
    runs-on: ubuntu-24.04
    strategy:
      # `fail-fast: false`: se o 25.11 quebrar, ainda se quer saber do 26.07.
      # O interesse e justamente a DIFERENCA entre as duas.
      fail-fast: false
      matrix:
        versao: ['25.11', '26.07']
    steps:
      # Corresponde a v7, o mesmo pin do job principal.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Ferramentas de build
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config ninja-build python3-pip g++-14 \
                                  libnuma-dev libpcap-dev
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 100
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100
          python3 -m pip install --upgrade meson pyelftools

      - name: Cache do DPDK ${{ matrix.versao }}
        id: cache-dpdk
        # Fixada por SHA, como a do checkout. Corresponde a v4; para atualizar:
        #   gh api repos/actions/cache/git/ref/tags/v4 --jq '.object.sha'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/opt/dpdk-${{ matrix.versao }}
          key: dpdk-${{ matrix.versao }}-${{ runner.os }}-${{ hashFiles('scripts/preparar-dpdk.sh') }}

      - name: Construir o DPDK ${{ matrix.versao }}
        if: steps.cache-dpdk.outputs.cache-hit != 'true'
        run: ./scripts/preparar-dpdk.sh --minimo ${{ matrix.versao }}

      - name: Conferir o prefixo
        run: ./scripts/preparar-dpdk.sh --conferir ${{ matrix.versao }}

      # `$HOME` resolvido no `run`, e nao caminho absoluto no `env`.
      #
      # Um caminho absoluto aqui presumiria o nome do usuario do runner, que e
      # detalhe da imagem e nao contrato. O portao de caminho absoluto acusa
      # isso, e faz certo: o mesmo bloco falharia num runner proprio.
      #
      # `lib/*/pkgconfig`: o meson instala num subdiretorio por arquitetura, e
      # fixar `x86_64-linux-gnu` amarraria o job a uma.
      - name: Configurar e compilar contra ${{ matrix.versao }}
        run: |
          export PKG_CONFIG_PATH="$(echo "$HOME/opt/dpdk-${{ matrix.versao }}"/lib/*/pkgconfig)"
          pkg-config --modversion libdpdk
          meson setup build-${{ matrix.versao }}
          meson compile -C build-${{ matrix.versao }}

      # `LD_LIBRARY_PATH` E NECESSARIO, e a primeira execucao deste job provou.
      #
      # Compilar contra um prefixo nao ensina o carregador dinamico a achar o
      # `.so` depois. Sem esta linha, os binarios sobem ate a chamada e morrem
      # em `error while loading shared libraries: librte_kvargs.so` -- dez
      # falhas de L2 que NAO sao do material. O `libdir` vem do mesmo
      # pkg-config que o build usou, e nao de um caminho digitado aqui.
      - name: Testes L1 e L2 contra ${{ matrix.versao }}
        env:
          DPDK_ACADEMY_AMOSTRAS: "3"
          DPDK_ACADEMY_RODADAS: "20000"
        run: |
          export PKG_CONFIG_PATH="$(echo "$HOME/opt/dpdk-${{ matrix.versao }}"/lib/*/pkgconfig)"
          export LD_LIBRARY_PATH="$(pkg-config --variable=libdir libdpdk)${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          meson test -C build-${{ matrix.versao }} --suite l1 --print-errorlogs
          meson test -C build-${{ matrix.versao }} --suite l2 --print-errorlogs
